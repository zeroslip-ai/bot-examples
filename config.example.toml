# Copy to config.toml. Secrets belong in .env, never in this file.
[wallet]
public_key = "" # Your wallet address; required for sell previews; live sells use the credential wallet.

[trade]
buy_amount = 0.001 # SOL-equivalent; USDC amounts convert using the trusted SOL/USDC stream pool.
buy_slippage = 20
sell_slippage = 99 # Original streaming sell tolerance
priority_fee = 0.0001 # SOL network priority fee
confirmation_seconds = 3

[sniper]
token_mint = "" # Set a mint for one entry attempt; blank scans new Pump launches.
min_initial_buy = 20 # SOL-equivalent; applies only to launch mode.
take_profit = 50 # Percent price rise from entry
stop_loss = 20 # Percent price fall from entry
idle_seconds = 300

[copytrader]
wallets = [] # Add wallet addresses to copy, or pass --wallet ADDRESS.
token_mints = [] # Empty allows any token within the Pump pool filters.
buy_fraction = 0.1
max_buy_amount = 0.01 # SOL-equivalent cap; converts to USDC automatically

[backtest]
hours = 10 # Original completed-UTC-hour default; archives can be hundreds of MB each.
allow_gaps = false
buy_latency_ms = 400
sell_latency_ms = 400
service_fee = 0.0025 # Fraction per side, not percent
extra_fee = 0.0005 # Additional modeling assumption per side

[sell]
slippage = 100 # Original sell-all tolerance
token_mints = [] # Or pass --mint ADDRESS; use --all to select all non-quote balances.

[network]
trade_url = "https://api.zeroslip.ai"
stream_url = "wss://stream.zeroslip.ai/"
replay_url = "https://replay.pumpapi.io" # Replay retains the documented PumpAPI hostname.
rpc_url = "https://api.mainnet-beta.solana.com" # Override with your own RPC if rate limited.
