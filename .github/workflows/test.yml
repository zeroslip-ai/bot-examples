name: Test bots
on:
  push:
    branches: [main, simplify-repo]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'aiohttp>=3.12,<4' 'websockets>=15,<16' 'zstandard>=0.23,<1' 'orjson>=3.10,<4'
      - run: python -m unittest discover -s tests -v
