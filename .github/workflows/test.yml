name: Standalone examples
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests tools standalone
      - run: ruff format --check scripts tests tools standalone
      - run: python tools/build_standalone.py --check
      - run: python -m compileall -q scripts standalone
      - run: python -m unittest discover -s tests -v
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked scripts/live_sniper_bot.py --check-config
